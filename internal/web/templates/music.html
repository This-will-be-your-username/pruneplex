<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171717">
    <title>Music | PrunePlex</title>
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-left">
          <a class="brand" href="/" aria-label="PrunePlex home">
            <img class="brand-mark" src="/assets/logo.svg" alt="" width="23" height="23">
            <span class="brand-name">Prune<span class="brand-light">Plex</span></span>
          </a>
          <nav class="main-nav" aria-label="Main navigation">
            <a class="nav-button" href="/">
              <span class="nav-icon overview-icon" aria-hidden="true"></span>Movies
            </a>
            <a class="nav-button" href="/tv">
              <span class="nav-icon tv-icon" aria-hidden="true"></span>TV Shows
            </a>
            <a class="nav-button active" href="/music" aria-current="page">
              <span class="nav-icon music-icon" aria-hidden="true"></span>Music
            </a>
            <a class="nav-button" href="/settings">
              <span class="nav-icon settings-icon" aria-hidden="true"></span>Settings
            </a>
          </nav>
        </div>
      </header>

      <main class="main-content" id="music-page">
        <section class="status-section" aria-labelledby="music-title">
          <div class="section-heading">
            <div>
              <div class="eyebrow muted">LIDARR LIBRARY</div>
              <div class="title-row">
                <h2 id="music-title">Music</h2>
                <div class="storage-summary" id="music-summary" aria-live="polite"></div>
              </div>
            </div>
            <div class="plex-actions">
              <button class="button button-secondary" id="music-refresh" type="button">Refresh</button>
            </div>
          </div>
          <p class="plex-message" id="music-message" role="status" aria-live="polite">Loading your Lidarr library…</p>

          <div class="results-search" id="music-tools" hidden>
            <input type="search" id="music-search" placeholder="Search artists and albums…" aria-label="Search artists and albums" autocomplete="off">
            <label class="inline-check">
              <input type="checkbox" id="music-show-empty">
              <span>Show albums without files</span>
            </label>
            <button class="button button-secondary button-sm" id="music-expand-all" type="button">Expand all</button>
            <button class="button button-secondary button-sm" id="music-collapse-all" type="button">Collapse all</button>
            <span class="search-note" id="music-note" role="status" aria-live="polite"></span>
          </div>

          <div class="artist-list" id="music-list"></div>
        </section>
      </main>
    </div>
    <script src="/assets/music.js" defer></script>
  </body>
</html>
