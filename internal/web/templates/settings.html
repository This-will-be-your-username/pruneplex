<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171717">
    <title>Settings | PrunePlex</title>
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-left">
          <a class="brand" href="/" aria-label="PrunePlex home">
            <img class="brand-mark" src="/assets/logo.svg" alt="" width="23" height="23">
            <span class="brand-name">Prune<span class="brand-light">Plex</span></span>
          </a>
          <nav class="main-nav" aria-label="Main navigation">
            <a class="nav-button" href="/">
              <span class="nav-icon overview-icon" aria-hidden="true"></span>Movies
            </a>
            <a class="nav-button" href="/tv">
              <span class="nav-icon tv-icon" aria-hidden="true"></span>TV Shows
            </a>
            <a class="nav-button active" href="/settings" aria-current="page">
              <span class="nav-icon settings-icon" aria-hidden="true"></span>Settings
            </a>
          </nav>
        </div>
      </header>

      <main class="main-content">
        {{range .Sections}}
        <section class="settings-section" aria-labelledby="{{.Prefix}}-title">
          <div class="settings-heading">
            <div>
              <div class="eyebrow muted">{{.Eyebrow}}</div>
              <h2 id="{{.Prefix}}-title">{{.Name}} instances</h2>
            </div>
            <span class="settings-message" id="{{.Prefix}}-message" role="status" aria-live="polite"></span>
          </div>

          <form class="arr-settings-form" id="{{.Prefix}}-settings-form" data-prefix="{{.Prefix}}" data-name="{{.Name}}">
            <div class="settings-grid">
              <fieldset class="settings-instance">
                <legend>4K {{.Name}}</legend>
                <p class="instance-state" id="{{.Prefix}}-4k-state">Not configured</p>
                <label for="{{.Prefix}}-4k-url">Server URL</label>
                <input id="{{.Prefix}}-4k-url" type="url" placeholder="http://{{.Prefix}}-4k:{{.Port}}" autocomplete="url">
                <label for="{{.Prefix}}-4k-key">API key</label>
                <input id="{{.Prefix}}-4k-key" type="password" autocomplete="new-password" placeholder="Leave blank to keep the saved key">
                <label for="{{.Prefix}}-4k-folder">Folder for free space</label>
                <select id="{{.Prefix}}-4k-folder" data-folder="4k" disabled>
                  <option value="">Save the connection to choose a folder</option>
                </select>
                <div class="instance-actions">
                  <button class="button button-secondary" type="button" data-test="4k">Test connection</button>
                  <button class="button button-danger" type="button" data-clear="4k" hidden>Clear</button>
                </div>
              </fieldset>

              <fieldset class="settings-instance">
                <legend>HD {{.Name}}</legend>
                <p class="instance-state" id="{{.Prefix}}-hd-state">Not configured</p>
                <label for="{{.Prefix}}-hd-url">Server URL</label>
                <input id="{{.Prefix}}-hd-url" type="url" placeholder="http://{{.Prefix}}-hd:{{.Port}}" autocomplete="url">
                <label for="{{.Prefix}}-hd-key">API key</label>
                <input id="{{.Prefix}}-hd-key" type="password" autocomplete="new-password" placeholder="Leave blank to keep the saved key">
                <label for="{{.Prefix}}-hd-folder">Folder for free space</label>
                <select id="{{.Prefix}}-hd-folder" data-folder="hd" disabled>
                  <option value="">Save the connection to choose a folder</option>
                </select>
                <div class="instance-actions">
                  <button class="button button-secondary" type="button" data-test="hd">Test connection</button>
                  <button class="button button-danger" type="button" data-clear="hd" hidden>Clear</button>
                </div>
              </fieldset>
            </div>

            <div class="settings-save-row">
              <p>API keys are stored locally with owner-only file permissions.</p>
              <button class="button button-primary" id="save-{{.Prefix}}-settings" type="submit">Save {{.Name}} settings</button>
            </div>
          </form>
        </section>
        {{end}}

      </main>
    </div>
    <script src="/assets/settings.js" defer></script>
  </body>
</html>
