name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no go.sum to key the cache on (the project has no dependencies)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test ./...
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build all platforms
        run: |
          # Tag builds are named after the tag; everything else is "edge-<short sha>".
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="edge-${GITHUB_SHA::7}"
          fi
          go run ./tools/build -version "$VERSION"
      - name: Verify checksums
        working-directory: dist
        run: |
          ls -l
          test "$(ls pruneplex-* | wc -l)" -eq 6
          sha256sum -c SHA256SUMS
      - name: Smoke test linux/amd64 binary
        run: |
          bin=$(ls dist/pruneplex-*-linux-amd64)
          chmod +x "$bin"
          PORT=18081 PRUNEPLEX_CONFIG="$RUNNER_TEMP/radarr.json" "$bin" &
          pid=$!
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18081/healthz && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18081/healthz | grep -q '"status":"ok"'
          kill $pid
      - uses: actions/upload-artifact@v7
        with:
          name: pruneplex-binaries
          path: dist/*
          if-no-files-found: error

  # A versioned release, published when a v* tag is pushed.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pruneplex-binaries
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=""
          # Tags like v1.0.0-rc1 are published as pre-releases.
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes $flags

  # A rolling pre-release named "edge", replaced on every push to main, so the
  # newest binaries are always on the Releases page without tagging anything.
  edge:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: edge-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pruneplex-binaries
          path: dist
      - name: Replace the edge pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete edge --repo "$REPO" --cleanup-tag --yes || true
          gh release create edge dist/* --repo "$REPO" --target "$SHA" --prerelease \
            --title "Latest build (edge)" \
            --notes "Automated build of \`main\` at ${SHA::7}. Unversioned and may be unstable; use a tagged release for something dependable."
