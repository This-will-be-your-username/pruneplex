name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test ./...
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build all platforms
        env:
          # Tag name on releases, short commit SHA otherwise. Passed via env
          # (not interpolated into the script) to avoid shell injection.
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: go run ./tools/build -version "$VERSION"
      - name: Verify checksums
        working-directory: dist
        run: |
          ls -l
          test "$(ls pruneplex-* | wc -l)" -eq 6
          sha256sum -c SHA256SUMS
      - name: Smoke test linux/amd64 binary
        run: |
          bin=$(ls dist/pruneplex-*-linux-amd64)
          chmod +x "$bin"
          PORT=18081 PRUNEPLEX_CONFIG="$RUNNER_TEMP/radarr.json" "$bin" &
          pid=$!
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18081/healthz && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18081/healthz | grep -q '"status":"ok"'
          kill $pid
      - uses: actions/upload-artifact@v4
        with:
          name: pruneplex-binaries
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pruneplex-binaries
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=""
          # Tags like v1.0.0-rc1 are published as pre-releases.
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes $flags
