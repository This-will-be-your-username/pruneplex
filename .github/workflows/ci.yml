name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no go.sum to key the cache on (the project has no dependencies)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test ./...
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build all platforms
        run: |
          # Tag builds are named after the tag; everything else is "edge-<short sha>".
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="edge-${GITHUB_SHA::7}"
          fi
          go run ./tools/build -version "$VERSION"
      - name: Verify checksums
        working-directory: dist
        run: |
          ls -l
          test "$(ls pruneplex-* | wc -l)" -eq 6
          sha256sum -c SHA256SUMS
      - name: Smoke test linux/amd64 binary
        run: |
          bin=$(ls dist/pruneplex-*-linux-amd64)
          chmod +x "$bin"
          PORT=18081 PRUNEPLEX_CONFIG="$RUNNER_TEMP/radarr.json" "$bin" &
          pid=$!
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18081/healthz && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18081/healthz | grep -q '"status":"ok"'
          kill $pid
      - uses: actions/upload-artifact@v7
        with:
          name: pruneplex-binaries
          path: dist/*
          if-no-files-found: error

  # Builds the container image and starts it through compose, the way a user
  # would, then checks it is healthy, within its limits and able to save settings.
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate and build
        run: |
          docker compose config -q
          docker compose build
          docker image ls pruneplex:local --format 'image size: {{.Size}}'
      - name: Start and wait for healthy
        run: |
          docker compose up -d
          status=starting
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' pruneplex)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health: $status"
          docker compose logs --no-color
          [ "$status" = healthy ]
          curl -fsS http://127.0.0.1:4848/healthz
      - name: Check limits and that the read-only container can save settings
        run: |
          # An empty Lidarr connection is valid; saving it writes /config/lidarr.json,
          # which proves the unprivileged user can write to the volume.
          curl -fsS -X PUT -H 'Content-Type: application/json' \
            -d '{"url":"","apiKey":""}' http://127.0.0.1:4848/api/settings/lidarr
          docker cp pruneplex:/config/lidarr.json -
          test "$(docker inspect --format '{{.HostConfig.Memory}}' pruneplex)" = 134217728
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' pruneplex)" = true
          test "$(docker inspect --format '{{.State.OOMKilled}}' pruneplex)" = false
          docker stats --no-stream --format 'idle usage: mem={{.MemUsage}} cpu={{.CPUPerc}}' pruneplex
      - name: Tear down
        if: always()
        run: docker compose down -v

  # A versioned release, published when a v* tag is pushed.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pruneplex-binaries
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=""
          # Tags like v1.0.0-rc1 are published as pre-releases.
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes $flags

  # Publishes the container image to GitHub's container registry (ghcr.io) once
  # the Docker smoke test has passed: "edge" for every push to main, and the
  # version (1.2.0, 1.2, 1, plus "latest" for stable releases) for v* tags.
  # Built for amd64 and arm64; the Dockerfile cross-compiles, so no emulation.
  publish-image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name (the registry requires lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A rolling pre-release named "edge", replaced on every push to main, so the
  # newest binaries are always on the Releases page without tagging anything.
  edge:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: edge-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pruneplex-binaries
          path: dist
      - name: Replace the edge pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete edge --repo "$REPO" --cleanup-tag --yes || true
          gh release create edge dist/* --repo "$REPO" --target "$SHA" --prerelease \
            --title "Latest build (edge)" \
            --notes "Automated build of \`main\` at ${SHA::7}. Unversioned and may be unstable; use a tagged release for something dependable."
